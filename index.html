<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESS Exoplanet Catalog</title>
<link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --bg:#fafafa; --panel:#fff; --border:#ddd; --muted:#6b7280; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #111; }
  .container { display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 12px 20px; background: #111827; color: white; border-bottom: 1px solid #000;
           display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
           position: sticky; top: 0; z-index: 50; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.01em; }
  nav { display: flex; gap: 18px; flex-wrap: wrap; }
  nav a { color: #cbd5e1; cursor: pointer; font-size: 0.88rem; text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav a:hover { color: #fff; }
  nav a.active { color: #fff; font-weight: 600; border-bottom-color: #fff; }
  #pagetext { flex: 0 0 auto; padding: 14px 24px; background: #fff;
              border-bottom: 1px solid var(--border); font-size: 0.95rem; line-height: 1.6; color: #1f2937; }
  #pagetext .md { max-width: min(78vw, 1280px); margin: 0 auto; }
  @media (max-width: 900px) { #pagetext .md { max-width: 100%; } }
  #pagetext.empty { display: none; }
  #pagetext h1 { font-size: 1.5rem; margin: 0.2em 0 0.4em; }
  #pagetext h2 { font-size: 1.2rem; margin: 0.8em 0 0.3em; }
  #pagetext h3 { font-size: 1.05rem; margin: 0.7em 0 0.3em; }
  #pagetext p { margin: 0.5em 0; }
  #pagetext a { color: var(--accent); text-decoration: none; }
  #pagetext a:hover { text-decoration: underline; }
  #pagetext code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-size: 0.88em; }
  #pagetext pre { background: #f1f5f9; padding: 10px 12px; border-radius: 6px; overflow: auto; }
  #pagetext img { max-width: 100%; }
  #pagetext table { border-collapse: collapse; }
  #pagetext th, #pagetext td { border: 1px solid var(--border); padding: 4px 8px; }
  /* toolbar */
  #toolbar { padding: 8px 20px; background: #f3f4f6; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; font-size: 0.85rem; }
  #toolbar input { padding: 4px 10px; font-size: 0.85rem; width: 280px; border: 1px solid var(--border); border-radius: 4px; }
  #toolbar .hint { color: var(--muted); }
  #download-btn, #ood-toggle { padding: 4px 12px; font-size: 0.82rem; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; color: #374151; white-space: nowrap; }
  #download-btn:hover, #ood-toggle:hover { background: #e5e7eb; }
  #ood-toggle.open { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
  #downloads { display: flex; gap: 8px; }
  .dl-btn { display: inline-flex; align-items: center; padding: 3px 10px; font-size: 0.82rem; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: #374151; text-decoration: none; white-space: nowrap; }
  .dl-btn:hover { background: #f3f4f6; color: #111; border-color: #9ca3af; }
  /* table + side-by-side OoD chart: sits in the page flow right under the text;
     fixed height so Tabulator can virtualize rows, the page itself scrolls freely */
  #content-row { display: flex; height: 80vh; min-height: 420px; overflow: hidden; }
  #table-wrap { flex: 1 1 auto; min-width: 0; padding: 0 20px; overflow: hidden; }
  #ood-panel { flex: 0 0 38%; min-width: 360px; max-width: 600px; display: none; flex-direction: column;
               border-left: 1px solid var(--border); background: #f9fafb; padding: 12px 16px; overflow: auto; }
  #ood-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; margin-bottom: 8px; }
  #ood-controls label { color: #374151; display: flex; align-items: center; gap: 5px; }
  #ood-controls select { padding: 3px 8px; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 4px; background: #fff; max-width: 160px; }
  #ood-controls select:disabled { background: #f3f4f6; color: var(--muted); }
  #ood-panel .hint { color: var(--muted); font-size: 0.8rem; margin-top: 6px; }
  #ood-chart-wrap { flex: 1 1 auto; min-height: 300px; position: relative; }
  #table { height: 100%; }
  #plot-panel { flex: 0 0 auto; position: relative; padding: 10px 20px 16px; background: var(--panel); border-top: 1px solid var(--border); display: none; }
  #plot-panel.visible { display: block; }
  #plot-panel h2 { margin: 0 32px 6px 0; font-size: 0.95rem; font-weight: 500; color: #374151; }
  #plot-close { position: absolute; top: 6px; right: 10px; width: 28px; height: 28px; line-height: 24px; text-align: center; border: 1px solid var(--border); border-radius: 50%; background: #fff; color: #4b5563; cursor: pointer; font-size: 1rem; padding: 0; }
  #plot-close:hover { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
  #plot-wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #plot { height: 380px; width: auto; max-width: 100%; border: 1px solid var(--border); background: #fff; }
  #nst  { height: 380px; aspect-ratio: 13 / 8; border: 1px solid var(--border); background: #fff; }
  .tabulator-row.tabulator-selected { background: #dbeafe !important; }
  .tabulator-row.tabulator-selectable:hover { background: #e0e7ff !important; cursor: pointer; }
  .tabulator { font-size: 0.82rem; }
  .tabulator-cell .pm { color: var(--muted); font-size: 0.82em; white-space: nowrap; }
  .tabulator-cell .pm sup, .tabulator-cell .pm sub { font-size: 0.92em; line-height: 0; }
  .tabulator-cell .ok { color: #15803d; font-weight: 600; }
  .tabulator-cell .no { color: #b91c1c; font-weight: 600; }
  .tabulator .tabulator-header { background: #f9fafb; font-weight: 500; }
  .fail-badge { background: #fee2e2; color: #b91c1c; border-radius: 3px; padding: 1px 5px; font-size: 0.78em; white-space: nowrap; margin-right: 2px; display: inline-block; }
</style>
</head>
<body>
<div class="container" id="container">
  <header>
    <h1 id="page-title">TESS Exoplanet Catalog</h1>
    <nav id="nav"></nav>
  </header>
  <div id="pagetext"></div>
  <div id="toolbar" style="display:none">
    <input id="filter" placeholder="Filter TIC or TOI&hellip;" autocomplete="off">
    <button id="download-btn" type="button" style="display:none">&#8595; CSV</button>
    <button id="ood-toggle" type="button" style="display:none">Interactive plot</button>
    <div id="downloads"></div>
    <span class="hint">Click any row to see its diagnostic plots &middot; Click column headers to sort</span>
  </div>
  <div id="content-row" style="display:none">
    <div id="table-wrap"><div id="table"></div></div>
    <div id="ood-panel">
      <div id="ood-controls">
        <label>X: <select id="ood-x"></select></label>
        <span id="ood-y-label" style="display:flex;align-items:center;gap:5px">Y: <select id="ood-y"></select></span>
        <label><input type="radio" name="ood-type" value="scatter" checked> Scatter</label>
        <label><input type="radio" name="ood-type" value="histogram"> Histogram</label>
      </div>
      <div id="ood-chart-wrap"><canvas id="ood-chart"></canvas></div>
      <span class="hint" id="ood-hint"></span>
    </div>
  </div>
  <div id="plot-panel">
    <button id="plot-close" type="button" aria-label="Close plot">&times;</button>
    <h2 id="plot-title"></h2>
    <div id="plot-wrap"><img id="plot" alt=""><canvas id="nst"></canvas></div>
  </div>
</div>

<script>
const COLUMNS_KOI = [
  { title: 'Kepler ID',    field: 'kepid',            sorter: 'number',  hozAlign: 'right',  width: 110, frozen: true, formatter: fmtInt },
  { title: 'KOI',          field: 'KOI',              sorter: 'number',  hozAlign: 'right',  width: 90,  formatter: fmtNum(2) },
  { title: 'Period [d]',   field: 'period',           sorter: 'number',  hozAlign: 'right',  width: 120, formatter: fmtSig },
  { title: 'τ [d]',        field: 'transit_duration', sorter: 'number',  hozAlign: 'right',  width: 80,  formatter: fmtSig },
  { title: 'SNR',          field: 'snr',              sorter: 'number',  hozAlign: 'right',  width: 95,  formatter: fmtSig },
  { title: 'p-value',      field: 'snrd_pvalue',      sorter: 'number',  hozAlign: 'right',  width: 110, formatter: fmtSig },
  { title: 'Holczer+2016', field: 'holczer',          sorter: 'boolean', hozAlign: 'center', width: 110, formatter: fmtPass },
];

const PAGES = [
  { key: 'overview',  title: 'Overview',                 md: 'overview.md',       type: 'placeholder' },
  { key: 'tess',      title: 'TESS Exoplanet Catalog',   md: 'tess.md',           type: 'table', csv: 'tois.csv',
    downloadFilename: 'tess_exoplanet_catalog.csv',
    hasOodChart: true,
    plot:  d => `plots/${d.TIC}/${d.known_idx}.jpg`,
    ptitle:d => `TIC ${d.TIC} · TOI ${d.TOI} · planet ${d.known_idx + 1} · P=${(+d.Period).toFixed(4)} d, Epoch=${(+d.Epoch).toFixed(4)} BTJD, Dur=${(+d.Duration).toFixed(4)} d · SNR=${(+d.SNR).toFixed(1)}` },
  { key: 'tessnew',   title: 'TESS New Candidates',      md: 'tess_new.md',       type: 'table', csv: 'tois_new.csv',
    downloadFilename: 'tess_new_candidates.csv',
    hasOodChart: true,
    colOverrides: { TOI: { visible: false } },
    extraColumns: [
      { title: 'Proposed TOI', field: 'proposed_toi', sorter: 'number', hozAlign: 'right', width: 110, formatter: fmtTOI, _after: 'TIC' },
    ],
    plot:  d => `plots_new/${d.TIC}/${d._cand_idx}.jpg`,
    ptitle:d => `TIC ${d.TIC} · proposed TOI ${d.proposed_toi != null ? Number(d.proposed_toi).toFixed(2) : ''} · P=${(+d.Period).toFixed(4)} d, Epoch=${(+d.Epoch).toFixed(4)} BTJD, Dur=${(+d.Duration).toFixed(4)} d · SNR=${(+d.SNR).toFixed(1)}` },
  { key: 'keplercat',  title: 'Kepler Exoplanet Catalog', md: 'kepler_catalog.md', type: 'placeholder' },
  { key: 'keplernew',  title: 'Kepler New Candidates',    md: 'kepler_new.md',     type: 'placeholder' },
  { key: 'keplerttvs', title: 'Kepler TTVs',              md: 'kepler_ttvs.md',    type: 'table', csv: 'kepler_ttvs_overview.csv',
    columns: COLUMNS_KOI, initialSort: [{ column: 'snr', dir: 'desc' }],
    filterFields: ['kepid', 'KOI'], filterPlaceholder: 'Filter Kepler ID or KOI…',
    downloads: [{ label: 'Download TTVs', file: 'kepler_ttvs.zip' }, { label: 'Download Table', file: 'kepler_ttvs_overview.csv' }],
    plot:  d => `plots_kepler_ttvs/${d.KOI}.png`,
    ptitle:d => `KOI ${d.KOI} · P=${(+d.period).toFixed(4)} d · SNR=${(+d.snr).toFixed(1)}`,
    nst: false },
];

const COLUMNS = [
  { title: 'TIC',         field: 'TIC',                 sorter: 'number',  hozAlign: 'right',  width: 110, frozen: true, formatter: fmtInt },
  { title: 'TOI',         field: 'TOI',                 sorter: 'number',  hozAlign: 'right',  width: 80,  formatter: fmtNum(2) },
  { title: 'Passes',      field: 'passed_all_tests',    sorter: 'boolean', hozAlign: 'center', width: 70,  formatter: fmtPass },
  { title: 'Failed',      field: 'failed_tests',        sorter: 'string',  hozAlign: 'left',   width: 145, formatter: fmtFailed },
  { title: 'Period [d]',  field: 'Period',               sorter: 'number',  hozAlign: 'right',  width: 150, formatter: fmtPM('err_Period') },
  { title: 'Epoch [BTJD]',field: 'Epoch',                sorter: 'number',  hozAlign: 'right',  width: 150, formatter: fmtEpoch('err_Epoch', 4) },
  { title: 'Duration [d]',field: 'Duration',             sorter: 'number',  hozAlign: 'right',  width: 140, formatter: fmtPM('err_Duration') },
  { title: 'SNR',         field: 'SNR',                  sorter: 'number',  hozAlign: 'right',  width: 95,  formatter: fmtSig },
  { title: 'Rₚ [R⊕]', field: 'Radius_planet',  sorter: 'number',  hozAlign: 'right',  width: 130, formatter: fmtPMasym('Radius_planet_errp', 'Radius_planet_errm') },
  { title: 'M★ [M☉]', field: 'Mass',           sorter: 'number',  hozAlign: 'right',  width: 90,  formatter: fmtSig },
  { title: 'R★ [R☉]', field: 'Radius',         sorter: 'number',  hozAlign: 'right',  width: 90,  formatter: fmtSig },
  { title: 'logg',        field: 'logg',                 sorter: 'number',  hozAlign: 'right',  width: 80,  formatter: fmtSig },
  { title: '[Fe/H]',      field: 'FEH',                  sorter: 'number',  hozAlign: 'right',  width: 80,  formatter: fmtSig },
  { title: 'Teff [K]',    field: 'Teff',                 sorter: 'number',  hozAlign: 'right',  width: 90,  formatter: fmtSig },
  { title: 'log₁₀ p', field: 'log10(p value)', sorter: 'number',  hozAlign: 'right',  width: 95,  formatter: fmtSig },
  { title: 'μ(null)', field: 'μ(SNR | null)',   sorter: 'number',  hozAlign: 'right',  width: 80,  formatter: fmtSig },
  { title: 'σ(null)', field: 'σ(SNR | null)',   sorter: 'number',  hozAlign: 'right',  width: 80,  formatter: fmtSig },
];

function buildColumns(page) {
  const ovr = page.colOverrides || {};
  let cols = COLUMNS.map(c => Object.assign({}, c, ovr[c.field] || {}));
  for (const xc of (page.extraColumns || [])) {
    const after = xc._after;
    const col = Object.assign({}, xc);
    delete col._after;
    if (after != null) {
      const idx = cols.findIndex(c => c.field === after);
      if (idx >= 0) { cols.splice(idx + 1, 0, col); continue; }
    }
    cols.push(col);
  }
  return cols;
}

function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.length);
  const header = lines[0].split(',');
  return lines.slice(1).map(line => {
    const cells = line.split(','); const obj = {};
    header.forEach((h, i) => {
      const v = cells[i];
      if (v == null || v === '') obj[h] = null;
      else if (v === 'True' || v === 'False') obj[h] = (v === 'True');
      else if (!isNaN(v) && v.trim() !== '') obj[h] = Number(v);
      else obj[h] = v;
    });
    return obj;
  });
}

function fmtNum(p) {
  return cell => {
    const v = cell.getValue();
    if (v == null || isNaN(v)) return '';
    if (Math.abs(v) >= 1e5 || (v !== 0 && Math.abs(v) < 1e-3)) return v.toExponential(2);
    return Number(v).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: p });
  };
}
function fmtInt(cell) { const v = cell.getValue(); return v == null ? '' : Number(v).toLocaleString(); }
function fmtTOI(cell) { const v = cell.getValue(); return (v == null || isNaN(v)) ? '' : Number(v).toFixed(2); }
function fmtPass(cell) {
  const v = cell.getValue();
  if (v === true)  return '<span class="ok">&#10004;</span>';
  if (v === false) return '<span class="no">&#10008;</span>';
  return '';
}
function fmtFailed(cell) {
  const v = cell.getValue();
  if (!v) return '';
  return v.split('|').map(t => `<span class="fail-badge">${t.trim()}</span>`).join('');
}
function sig3(v) {
  if (v == null || isNaN(v) || !isFinite(v)) return '';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e6 || a < 1e-4) return v.toExponential(2);
  const k = Math.floor(Math.log10(a)) - 2;
  const r = Math.round(v / 10 ** k) * 10 ** k;
  const dec = Math.max(0, -k);
  return Number(r).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: dec });
}
function fmtSig(cell) { return sig3(cell.getValue()); }
function fmtErr1(e) {
  e = Number(e);
  if (!isFinite(e) || e === 0) return null;
  e = Math.abs(e);
  if (e >= 1e5 || e < 1e-3) return e.toExponential(0);
  const d = Math.max(0, 1 - Math.floor(Math.log10(e)));
  return e.toFixed(Math.min(d, 6));
}
function fmtPM(errField) {
  return cell => {
    const v = cell.getValue();
    if (v == null || isNaN(v)) return '';
    const es = fmtErr1(cell.getRow().getData()[errField]);
    return es == null ? sig3(v) : `${sig3(v)} <span class="pm">&plusmn; ${es}</span>`;
  };
}
function fmtEpoch(errField, p) {
  return cell => {
    const v = cell.getValue();
    if (v == null || isNaN(v)) return '';
    const vs = Number(v).toFixed(p);
    const es = fmtErr1(cell.getRow().getData()[errField]);
    return es == null ? vs : `${vs} <span class="pm">&plusmn; ${es}</span>`;
  };
}
function fmtPMasym(errpField, errmField) {
  return cell => {
    const v = cell.getValue();
    if (v == null || isNaN(v)) return '';
    const ep = fmtErr1(cell.getRow().getData()[errpField]);
    const em = fmtErr1(cell.getRow().getData()[errmField]);
    if (ep == null && em == null) return sig3(v);
    return `${sig3(v)} <span class="pm"><sup>+${ep ?? '?'}</sup><sub>&minus;${em ?? '?'}</sub></span>`;
  };
}

// NST null distribution: empirical CDF (step function) + fitted Gaussian CDF
// Shared SNR grid on which each star's Singh-Maddala posterior-mean log10(survival function) is
// tabulated (the 'sm_sf_grid' column). MUST match pvalue/fit_all.py and sm_pvalue.py.
const SM_XGRID = (() => {       // dense to 20 + coarse tail to 2500; MUST match pvalue/fit_all.py
  const gs = (a, b, n) => { const la = Math.log(a), lb = Math.log(b);
    return Array.from({ length: n }, (_, i) => Math.exp(la + (lb - la) * i / (n - 1))); };
  return gs(1.5, 20, 65).concat(gs(20, 2500, 16).slice(1)); })();   // drop duplicate 20 -> 80 points
const SM_LXG = SM_XGRID.map(Math.log10);

function smInterp(lx, grid) {            // log10(SF) at log10(SNR)=lx; clamp at ends (= np.interp)
  if (lx <= SM_LXG[0]) return grid[0];
  const n = SM_LXG.length;
  if (lx >= SM_LXG[n - 1]) return grid[n - 1];
  let i = 1; while (SM_LXG[i] < lx) i++;
  const t = (lx - SM_LXG[i - 1]) / (SM_LXG[i] - SM_LXG[i - 1]);
  return grid[i - 1] + t * (grid[i] - grid[i - 1]);
}

// "10^exp" with a proper raised superscript (and unicode minus), right-aligned to end at xRight.
function drawPow10(ctx, exp, xRight, y, F) {
  ctx.fillStyle = '#5b6472';
  if (exp === 0) { ctx.font = F + 'px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('1', xRight, y + F * 0.34); return; }
  const sup = (exp < 0 ? '−' : '') + Math.abs(exp);
  const fs = Math.round(F * 0.68);
  ctx.textAlign = 'left';
  ctx.font = F + 'px sans-serif'; const w10 = ctx.measureText('10').width;
  ctx.font = fs + 'px sans-serif'; const ws = ctx.measureText(sup).width;
  const sx = xRight - (w10 + ws);
  ctx.font = F + 'px sans-serif'; ctx.fillText('10', sx, y + F * 0.34);
  ctx.font = fs + 'px sans-serif'; ctx.fillText(sup, sx + w10, y + F * 0.34 - F * 0.46);
}

// Per-candidate survival-function (log scale) panel: the star's Singh-Maddala posterior-mean SF
// model vs the empirical NST survival function, with the candidate's SNR and p-value.
function drawNullSF(canvas, sfGridStr, snr, log10p, nstSamplesStr) {
  const W = 1300, H = 800, ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const grid = (sfGridStr || '').split('|').map(Number);
  if (grid.length !== SM_XGRID.length || grid.some(v => !isFinite(v))) {
    ctx.fillStyle = '#888'; ctx.textAlign = 'center'; ctx.font = 'italic 30px sans-serif';
    ctx.fillText('No null-simulation (NST) fit for this candidate', W / 2, H / 2);
    return;
  }
  const xs = (nstSamplesStr || '').split('|').map(Number)
    .filter(v => isFinite(v) && v > 0).sort((a, b) => a - b);
  const hasEmp = xs.length >= 3;
  snr = Math.max(snr, 1.001);
  if (log10p == null || !isFinite(log10p)) log10p = smInterp(Math.log10(snr), grid);

  const px0 = 132, px1 = W - 46, py0 = 54, py1 = H - 100;
  let loSNR = hasEmp ? Math.min(xs[0] * 0.85, snr * 0.7) : snr * 0.6;
  loSNR = Math.max(loSNR, 1.5);
  const hiSNR = Math.max(snr, hasEmp ? xs[xs.length - 1] : 0) * 1.15;
  const lo = Math.log10(loSNR), hi = Math.log10(hiSNR);
  const yTop = 0.18, yBot = Math.min(log10p, hasEmp ? Math.log10(1 / xs.length) : 0) - 0.55;
  const X = s => px0 + (Math.log10(Math.max(s, loSNR)) - lo) / (hi - lo) * (px1 - px0);
  const Y = ly => py0 + (yTop - ly) / (yTop - yBot) * (py1 - py0);
  const modelY = s => Y(smInterp(Math.log10(s), grid));

  // x ticks (1-2-5 per decade); y decade ticks, thinned for large spans
  const tickSets = [[1, 2, 5], [1, 1.5, 2, 3, 4, 5, 6, 8]];
  let TICKS = [];
  for (const mants of tickSets) {
    TICKS = [];
    for (let dec = Math.floor(lo); dec <= Math.ceil(hi); dec++)
      for (const m of mants) { const t = m * 10 ** dec, u = Math.log10(t);
        if (u >= lo - 1e-9 && u <= hi + 1e-9) TICKS.push(t); }
    if (TICKS.length >= 4) break;
  }
  const dstep = Math.max(1, Math.ceil((yTop - yBot) / 9));
  const YT = [];
  for (let d = 0; d >= Math.floor(yBot); d -= dstep) if (d <= yTop + 1e-9) YT.push(d);

  // light gridlines
  ctx.strokeStyle = '#eef0f4'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  TICKS.forEach(t => { ctx.beginPath(); ctx.moveTo(X(t), py0); ctx.lineTo(X(t), py1); ctx.stroke(); });
  YT.forEach(d => { ctx.beginPath(); ctx.moveTo(px0, Y(d)); ctx.lineTo(px1, Y(d)); ctx.stroke(); });

  // model SF: soft fill under the curve, then the smooth curve
  ctx.beginPath();
  for (let px = px0; px <= px1; px++) {
    const yy = Y(smInterp(lo + (px - px0) / (px1 - px0) * (hi - lo), grid));
    px === px0 ? ctx.moveTo(px, yy) : ctx.lineTo(px, yy);
  }
  ctx.lineTo(px1, py1); ctx.lineTo(px0, py1); ctx.closePath();
  ctx.fillStyle = 'rgba(47,127,193,0.08)'; ctx.fill();
  ctx.beginPath();
  for (let px = px0; px <= px1; px++) {
    const yy = Y(smInterp(lo + (px - px0) / (px1 - px0) * (hi - lo), grid));
    px === px0 ? ctx.moveTo(px, yy) : ctx.lineTo(px, yy);
  }
  ctx.strokeStyle = '#1f6fb2'; ctx.lineWidth = 4.5; ctx.stroke();

  // empirical SF: clean white-edged circles at SF = (n-j)/n (no staircase)
  if (hasEmp) {
    const n = xs.length;
    for (let j = 0; j < n; j++) {
      ctx.beginPath(); ctx.arc(X(xs[j]), Y(Math.log10((n - j) / n)), 8, 0, 2 * Math.PI);
      ctx.fillStyle = '#143b66'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }

  // candidate: soft vertical guide + marker on the model curve
  ctx.beginPath(); ctx.setLineDash([6, 7]); ctx.strokeStyle = 'rgba(214,69,63,0.85)'; ctx.lineWidth = 2.5;
  ctx.moveTo(X(snr), py0); ctx.lineTo(X(snr), py1); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(X(snr), modelY(snr), 9.5, 0, 2 * Math.PI);
  ctx.fillStyle = '#d6453f'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();

  // axes (left + bottom only)
  ctx.strokeStyle = '#c3cad6'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px0, py0); ctx.lineTo(px0, py1); ctx.lineTo(px1, py1); ctx.stroke();

  // x tick labels
  ctx.fillStyle = '#5b6472'; ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 2;
  ctx.strokeStyle = '#c3cad6';
  TICKS.forEach(t => {
    ctx.beginPath(); ctx.moveTo(X(t), py1); ctx.lineTo(X(t), py1 + 9); ctx.stroke();
    ctx.fillText(String(t), X(t), py1 + 40);
  });
  ctx.fillStyle = '#374151'; ctx.font = '29px sans-serif';
  ctx.fillText('matched-filter SNR', (px0 + px1) / 2, H - 26);

  // y tick labels (proper 10^n superscripts)
  ctx.strokeStyle = '#c3cad6'; ctx.lineWidth = 2;
  YT.forEach(d => {
    ctx.beginPath(); ctx.moveTo(px0 - 9, Y(d)); ctx.lineTo(px0, Y(d)); ctx.stroke();
    drawPow10(ctx, d, px0 - 16, Y(d), 24);
  });
  ctx.save(); ctx.translate(30, (py0 + py1) / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#374151'; ctx.textAlign = 'center'; ctx.font = '28px sans-serif';
  ctx.fillText('survival function   p = P(noise ≥ SNR)', 0, 0); ctx.restore();

  // p-value label
  const pval = 10 ** log10p;
  const pStr = (pval < 1e-4 || pval === 0) ? (log10p <= -300 ? '<1e-300' : pval.toExponential(2)) : pval.toFixed(4);

  // legend (lower-left, over the light fill)
  const items = [
    { label: 'Singh–Maddala null SF',
      draw: cy => { ctx.strokeStyle = '#1f6fb2'; ctx.lineWidth = 4.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(2, cy); ctx.lineTo(46, cy); ctx.stroke(); } },
  ];
  if (hasEmp) items.push(
    { label: 'NST samples (empirical SF)',
      draw: cy => { ctx.beginPath(); ctx.arc(24, cy, 8, 0, 2 * Math.PI);
        ctx.fillStyle = '#143b66'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke(); } });
  items.push(
    { label: `candidate   p = ${pStr}`,
      draw: cy => { ctx.beginPath(); ctx.arc(24, cy, 9, 0, 2 * Math.PI);
        ctx.fillStyle = '#d6453f'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke(); } });

  ctx.font = '25px sans-serif';
  const lw = 70 + Math.max(...items.map(it => ctx.measureText(it.label).width)) + 22;
  const lh = 24 + items.length * 44;
  const lx = px0 + 20, ly = py1 - lh - 20;
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.strokeStyle = '#e2e6ec'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(lx, ly, lw, lh, 12); else ctx.rect(lx, ly, lw, lh);
  ctx.fill(); ctx.stroke();
  ctx.textAlign = 'left';
  items.forEach((it, i) => {
    const cy = ly + 38 + i * 44;
    ctx.save(); ctx.translate(lx + 16, 0); it.draw(cy); ctx.restore();
    ctx.fillStyle = '#26303d'; ctx.fillText(it.label, lx + 82, cy + 8);
  });
}

function loadChartJs() {
  return new Promise((resolve, reject) => {
    if (typeof Chart !== 'undefined') { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

// OoD interactive chart (Chart.js)
const OOD_SKIP = new Set([
  'TIC', 'TOI', 'proposed_toi', '_cand_idx', 'known_idx', 'Has Visible TTVs', 'Interesting',
  'failed_tests', 'nst_samples', 'sm_sf_grid', 'passed_all_tests', 'ood_pvalue', 'outlier_score',
  'Multiplicity', 'err_Period', 'err_Epoch', 'err_Duration',
  'Radius_planet_errp', 'Radius_planet_errm',
]);

function numericCols(rows) {
  if (!rows.length) return [];
  return Object.keys(rows[0]).filter(k => {
    if (OOD_SKIP.has(k)) return false;
    const sample = rows.slice(0, 40).map(r => r[k]).filter(v => v != null);
    if (!sample.length) return false;
    return sample.filter(v => typeof v === 'number' && isFinite(v)).length / sample.length > 0.6;
  });
}

let oodChart = null;

function buildOodChart(rows, xField, yField, chartType, page) {
  const canvas = document.getElementById('ood-chart');
  if (oodChart) { oodChart.destroy(); oodChart = null; }

  if (chartType === 'scatter') {
    const regular = [], ood = [];
    rows.forEach(r => {
      const x = r[xField], y = r[yField];
      if (x == null || !isFinite(x) || y == null || !isFinite(y)) return;
      (r.Interesting ? ood : regular).push({ x, y, _row: r });
    });
    const datasets = [
      { label: 'Candidates', data: regular,
        backgroundColor: 'rgba(100,120,200,0.5)', pointRadius: 4, pointHoverRadius: 7 },
    ];
    if (ood.length) datasets.push(
      { label: 'OoD (interesting)', data: ood,
        backgroundColor: 'rgba(230,100,20,0.85)', pointRadius: 10, pointHoverRadius: 12,
        pointStyle: 'star' });
    oodChart = new Chart(canvas, {
      type: 'scatter',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'top' },
          tooltip: { callbacks: { label: ctx => `TIC ${ctx.raw._row.TIC}  (${Number(ctx.raw.x).toPrecision(4)}, ${Number(ctx.raw.y).toPrecision(4)})` } }
        },
        scales: {
          x: { title: { display: true, text: xField } },
          y: { title: { display: true, text: yField } },
        },
        onClick: (event, elements) => {
          if (!elements.length) return;
          const el = elements[0];
          const row = oodChart.data.datasets[el.datasetIndex].data[el.index]._row;
          showPlot(page, row);
        },
      }
    });
  } else {
    // Histogram
    const vals = rows.map(r => r[xField]).filter(v => v != null && isFinite(v));
    if (!vals.length) return;
    const mn = vals.reduce((a, b) => Math.min(a, b), Infinity), mx = vals.reduce((a, b) => Math.max(a, b), -Infinity);
    const BINS = 25, bw = (mx - mn) / (BINS || 1);
    const regC = new Array(BINS).fill(0), oodC = new Array(BINS).fill(0);
    rows.forEach(r => {
      const v = r[xField]; if (v == null || !isFinite(v)) return;
      const idx = Math.min(Math.floor((v - mn) / (bw || 1)), BINS - 1);
      (r.Interesting ? oodC : regC)[idx]++;
    });
    const labels = Array.from({ length: BINS }, (_, i) => (mn + (i + 0.5) * bw).toPrecision(3));
    const datasets = [
      { label: 'Candidates', data: regC, backgroundColor: 'rgba(100,120,200,0.65)', stack: 'a' },
    ];
    if (oodC.some(c => c > 0)) datasets.push(
      { label: 'OoD (interesting)', data: oodC, backgroundColor: 'rgba(230,100,20,0.75)', stack: 'a' });
    oodChart = new Chart(canvas, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'top' } },
        scales: {
          x: { stacked: true, title: { display: true, text: xField } },
          y: { stacked: true, title: { display: true, text: 'Count' } },
        }
      }
    });
  }
}

async function setupOodPanel(rows, page) {
  try { await loadChartJs(); } catch (e) { console.warn('Chart.js failed to load', e); return; }
  const hasOod = rows.some(r => r.Interesting);
  document.getElementById('ood-hint').textContent = hasOod
    ? 'Orange stars = out-of-distribution (OoD) candidates — click any point to view its diagnostic plots'
    : 'Click any point to view its diagnostic plots';
  const cols = numericCols(rows);
  const selX = document.getElementById('ood-x');
  const selY = document.getElementById('ood-y');
  const selYWrap = document.getElementById('ood-y-label');
  [selX, selY].forEach(sel => {
    sel.innerHTML = '';
    cols.forEach(c => {
      const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  });
  selX.value = cols.includes('Period') ? 'Period' : cols[0];
  selY.value = cols.includes('Radius_planet') ? 'Radius_planet' : (cols[1] || cols[0]);

  const redraw = () => {
    const ct = document.querySelector('input[name="ood-type"]:checked').value;
    selY.disabled = ct === 'histogram';
    selYWrap.style.opacity = ct === 'histogram' ? '0.4' : '1';
    buildOodChart(rows, selX.value, selY.value, ct, page);
  };
  selX.onchange = redraw; selY.onchange = redraw;
  document.querySelectorAll('input[name="ood-type"]').forEach(r => r.onchange = redraw);
  redraw();
}

// app
const els = {};
let table = null, currentPage = null, currentRows = null, oodOpen = false;
const cacheCSV = {}, cacheMD = {};

async function loadData(page) {
  if (cacheCSV[page.key]) return cacheCSV[page.key];
  const rows = parseCSV(await (await fetch(page.csv)).text());
  if (page.key === 'tess') {
    const counter = new Map();
    rows.forEach(r => { const k = counter.get(r.TIC) ?? 0; r.known_idx = k; counter.set(r.TIC, k + 1); });
  }
  cacheCSV[page.key] = rows;
  return rows;
}

async function loadPageText(page) {
  const el = els.pagetext;
  if (!page.md) { el.classList.add('empty'); el.innerHTML = ''; return; }
  if (cacheMD[page.key] === undefined) {
    try { const r = await fetch(page.md); cacheMD[page.key] = r.ok ? await r.text() : ''; }
    catch (e) { cacheMD[page.key] = ''; }
  }
  const md = cacheMD[page.key];
  if (!md.trim()) { el.classList.add('empty'); el.innerHTML = ''; return; }
  el.classList.remove('empty');
  // Shield LaTeX from the markdown parser: marked would otherwise pair up
  // underscores across $...$ spans and wrap them in <em>, breaking KaTeX.
  const mathStore = [];
  const protectedMd = md
    .replace(/\$\$[\s\S]+?\$\$/g, m => `@@MATH${mathStore.push(m) - 1}@@`)
    .replace(/\$[^$\n]+?\$/g, m => `@@MATH${mathStore.push(m) - 1}@@`);
  let html = marked.parse(protectedMd);
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) =>
    mathStore[+i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
  el.innerHTML = '<div class="md">' + html + '</div>';
  if (window.renderMathInElement) renderMathInElement(el, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
      { left: '\\(', right: '\\)', display: false },
      { left: '\\[', right: '\\]', display: true },
    ], throwOnError: false,
  });
}

function showPlot(page, d) {
  els.plotImg.src = page.plot(d);
  els.plotImg.alt = page.ptitle(d);
  els.plotTitle.textContent = page.ptitle(d);
  if (page.nst === false) {
    els.nst.style.display = 'none';
  } else {
    els.nst.style.display = '';
    drawNullSF(els.nst, d['sm_sf_grid'] || '', d.SNR, d['log10(p value)'], d['nst_samples'] || '');
  }
  els.plotPanel.classList.add('visible');
  els.plotPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function renderTablePage(page) {
  currentPage = page;
  els.container.classList.remove('text-only');
  els.toolbar.style.display = 'flex';
  els.contentRow.style.display = 'flex';
  els.plotPanel.classList.remove('visible');
  els.filter.value = '';
  els.filter.placeholder = page.filterPlaceholder || 'Filter TIC or TOI…';

  const hintEl = document.querySelector('#toolbar .hint');
  if (hintEl) hintEl.textContent = page.plot
    ? 'Click any row to see its diagnostic plots · Click column headers to sort'
    : 'Click column headers to sort';

  if (page.downloadFilename) {
    els.downloadBtn.style.display = '';
    els.downloadBtn.onclick = () => table && table.download('csv', page.downloadFilename);
  } else {
    els.downloadBtn.style.display = 'none';
  }

  els.downloads.innerHTML = '';
  (page.downloads || []).forEach(({ label, file }) => {
    const a = document.createElement('a');
    a.className = 'dl-btn'; a.textContent = label; a.href = file; a.download = file;
    els.downloads.appendChild(a);
  });

  // OoD chart panel starts closed on every page switch; opened via the toggle button
  oodOpen = false;
  els.oodPanel.style.display = 'none';
  els.oodToggle.classList.remove('open');
  els.oodToggle.style.display = page.hasOodChart ? '' : 'none';
  if (oodChart) { oodChart.destroy(); oodChart = null; }

  if (table) { table.destroy(); table = null; }
  const rows = await loadData(page);
  currentRows = rows;
  table = new Tabulator('#table', {
    data: rows, height: '100%', layout: 'fitDataTable',
    selectableRows: 1, movableColumns: true,
    initialSort: page.initialSort || [{ column: 'SNR', dir: 'desc' }],
    columns: page.columns || buildColumns(page),
  });
  if (page.plot) table.on('rowClick', (e, row) => showPlot(page, row.getData()));
}

function renderPlaceholder() {
  els.container.classList.add('text-only');
  els.toolbar.style.display = 'none';
  els.contentRow.style.display = 'none';
  els.plotPanel.classList.remove('visible');
  els.oodPanel.style.display = 'none';
  els.oodToggle.style.display = 'none';
  els.downloadBtn.style.display = 'none';
  els.downloads.innerHTML = '';
  oodOpen = false;
  if (oodChart) { oodChart.destroy(); oodChart = null; }
  if (table) { table.destroy(); table = null; }
}

function switchPage(key) {
  const page = PAGES.find(p => p.key === key) || PAGES.find(p => p.key === 'tess');
  document.getElementById('page-title').textContent = page.title;
  document.title = page.title;
  [...els.nav.children].forEach(a => a.classList.toggle('active', a.dataset.key === page.key));
  if (location.hash !== '#' + page.key) history.replaceState(null, '', '#' + page.key);
  window.scrollTo(0, 0);
  loadPageText(page);
  if (page.type === 'table') renderTablePage(page); else renderPlaceholder();
}

function main() {
  els.container   = document.getElementById('container');
  els.nav         = document.getElementById('nav');
  els.pagetext    = document.getElementById('pagetext');
  els.toolbar     = document.getElementById('toolbar');
  els.filter      = document.getElementById('filter');
  els.downloadBtn = document.getElementById('download-btn');
  els.downloads   = document.getElementById('downloads');
  els.oodPanel    = document.getElementById('ood-panel');
  els.oodToggle   = document.getElementById('ood-toggle');
  els.oodHint     = document.getElementById('ood-hint');
  els.contentRow  = document.getElementById('content-row');
  els.tableWrap   = document.getElementById('table-wrap');
  els.plotPanel   = document.getElementById('plot-panel');
  els.plotImg     = document.getElementById('plot');
  els.plotTitle   = document.getElementById('plot-title');
  els.nst         = document.getElementById('nst');

  PAGES.forEach(p => {
    const a = document.createElement('a');
    a.textContent = p.title; a.dataset.key = p.key; a.href = '#' + p.key;
    els.nav.appendChild(a);
  });
  els.filter.addEventListener('input', () => {
    if (!table) return;
    const v = els.filter.value.trim();
    if (!v) { table.clearFilter(true); return; }
    const fields = currentPage?.filterFields || ['TIC', 'TOI'];
    table.setFilter([fields.map(f => ({ field: f, type: 'like', value: v }))]);
  });
  els.oodToggle.addEventListener('click', async () => {
    oodOpen = !oodOpen;
    els.oodPanel.style.display = oodOpen ? 'flex' : 'none';
    els.oodToggle.classList.toggle('open', oodOpen);
    if (table) table.redraw(true);
    if (oodOpen && currentRows) await setupOodPanel(currentRows, currentPage);
  });
  document.getElementById('plot-close').addEventListener('click', () => {
    els.plotPanel.classList.remove('visible');
    els.plotImg.removeAttribute('src');
    if (table) table.deselectRow();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && els.plotPanel.classList.contains('visible')) document.getElementById('plot-close').click();
  });
  window.addEventListener('hashchange', () => switchPage(location.hash.slice(1)));
  switchPage(location.hash.slice(1) || 'tess');
}

main();
</script>
